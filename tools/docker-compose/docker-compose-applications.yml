services:
  write-api-server-1:
    command: ["writeApi"]
    image: cqrs-es-spec-kit-go:latest
    container_name: write-api-server-1
    ports:
      - 28080:8080
    environment:
      AWS_REGION: ${AWS_REGION}
      API_HOST: "0.0.0.0"
      API_PORT: 8080
      API_ALLOW_ORIGINS: "http://localhost:28080,http://localhost:28082,http://localhost:8888"
      PERSISTENCE_JOURNAL_TABLE_NAME: journal
      PERSISTENCE_JOURNAL_AID_INDEX_NAME: journal-aid-index
      PERSISTENCE_SNAPSHOT_TABLE_NAME: snapshot
      PERSISTENCE_SNAPSHOT_AID_INDEX_NAME: snapshot-aid-index
      PERSISTENCE_SHARD_COUNT: 64
      PERSISTENCE_SNAPSHOT_INTERVAL: 10
      AWS_REGION_NAME: ${AWS_REGION}
      AWS_DYNAMODB_ENDPOINT_URL: http://localstack:4566
      AWS_DYNAMODB_ACCESS_KEY_ID: x
      AWS_DYNAMODB_SECRET_ACCESS_KEY: x
    depends_on:
      - localstack
      - dynamodb-admin
      - dynamodb-setup
  lambda-setup:
    image: cqrs-es-spec-kit-go-rmu:latest
    container_name: lambda-setup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Installing aws-cli..."
        yum install -y aws-cli
        echo "Deploying Lambda function..."
        /scripts/deploy-lambda.sh
        echo "Creating event source mapping..."
        /scripts/create-event-mapping.sh
        echo "Lambda setup completed"
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      LAMBDA_FUNCTION_NAME: read-model-updater
      LAMBDA_ZIP_PATH: /lambda/function.zip
      DATABASE_URL: ceer:ceer@tcp(192.168.65.254:23306)/ceer
      STREAM_JOURNAL_TABLE_NAME: journal
      EVENT_BATCH_SIZE: 10
      MAX_RETRY_ATTEMPTS: 2
    volumes:
      - ../lambda-setup:/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      dynamodb-setup:
        condition: service_completed_successfully
  read-api-server-1:
    command: [ "readApi" ]
    image: cqrs-es-spec-kit-go:latest
    container_name: read-api-server-1
    ports:
      - 28082:8080
    environment:
      AWS_REGION: ${AWS_REGION}
      API_HOST: "0.0.0.0"
      API_PORT: 8080
      API_ALLOW_ORIGINS: "http://localhost:28080,http://localhost:18082,http://localhost:8888"
      DATABASE_URL: ceer:ceer@tcp(mysql-local:3306)/ceer
    depends_on:
      - mysql
      - migration
      - write-api-server-1
      - lambda-setup
